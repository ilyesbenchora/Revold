<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Même marque que le logo de l'app (RevoldLogo) : avatar rond en dégradé
       fuchsia → purple → indigo avec le flocon fin blanc. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#bg)"/>
  <!-- Liseré lumineux discret, comme le ring du logo -->
  <circle cx="24" cy="24" r="23.2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>

  <!-- Flocon (même dessin que l'orbe, trait épaissi pour rester lisible en 16px) -->
  <g transform="translate(10.5 10.5) scale(1.125)"
     fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"/>
    <line x1="4.2" y1="7.5" x2="19.8" y2="16.5"/>
    <line x1="19.8" y1="7.5" x2="4.2" y2="16.5"/>
    <path d="M12 3l-1.6 1.9M12 3l1.6 1.9M12 21l-1.6-1.9M12 21l1.6-1.9"/>
    <path d="M4.2 7.5l2.4.3M4.2 16.5l2.4-.3M19.8 7.5l-2.4.3M19.8 16.5l-2.4-.3"/>
  </g>
</svg>
