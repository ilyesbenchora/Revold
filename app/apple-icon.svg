<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Même marque que le logo de l'app (RevoldLogo) : dégradé fuchsia → purple
       → indigo avec le flocon fin blanc (iOS arrondit lui-même les coins). -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- Flocon (même dessin que l'orbe) -->
  <g transform="translate(40 40) scale(4.1667)"
     fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"/>
    <line x1="4.2" y1="7.5" x2="19.8" y2="16.5"/>
    <line x1="19.8" y1="7.5" x2="4.2" y2="16.5"/>
    <path d="M12 3l-1.6 1.9M12 3l1.6 1.9M12 21l-1.6-1.9M12 21l1.6-1.9"/>
    <path d="M4.2 7.5l2.4.3M4.2 16.5l2.4-.3M19.8 7.5l-2.4.3M19.8 16.5l-2.4-.3"/>
  </g>
</svg>
